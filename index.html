<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marker Labels</title>
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>


    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <div id="main-container">
      <div id="side-panel">
        <div id="controls">
          <input id="route-code" type="text" placeholder="Código de ruta" />
          <button id="load-route">Cargar ruta</button>
          <input id="place-search" type="text" placeholder="Buscar lugar..." />
        </div>
        <div id="route-list"></div>
      </div>
      <div id="map-container">
        <div id="map"></div>
      </div>
    </div>
    <!-- Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBdj0ql0WA-UJACXz0HxydfN7HA22r-Ozo&libraries=places&v=weekly&callback=initMap" defer></script>
  </body>
</html>
